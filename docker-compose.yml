services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: lexgraph-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_PORT=6006
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: lexgraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-lexgraph-dev-password}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lexgraph-redis
    profiles: ["enterprise"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lexgraph-postgres
    profiles: ["enterprise"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lexgraph
      - POSTGRES_USER=lexgraph
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lexgraph-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  lexgraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexgraph-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - ENV=${ENV:-production}
      - AUTH_MODE=${AUTH_MODE:-api_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock-key-for-ci}
      - MODEL_NAME=${MODEL_NAME:-gemini-2.5-flash}
      - LEXGRAPH_MODEL_FAST=${LEXGRAPH_MODEL_FAST:-gemini-2.5-flash}
      - LEXGRAPH_MODEL_REASONING=${LEXGRAPH_MODEL_REASONING:-gemini-2.5-pro}
      - USD_TO_MYR_RATE=${USD_TO_MYR_RATE:-4.40}
      - LEXGRAPH_USD_MYR_FALLBACK=${LEXGRAPH_USD_MYR_FALLBACK:-4.40}
      - INPUT_COST_PER_1M_USD=${INPUT_COST_PER_1M_USD:-0.15}
      - OUTPUT_COST_PER_1M_USD=${OUTPUT_COST_PER_1M_USD:-0.60}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - GRAPH_BACKEND=${GRAPH_BACKEND:-memory}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_HTTP_URL=http://neo4j:7474
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-lexgraph-dev-password}
      - OCR_PROVIDER=${OCR_PROVIDER:-none}
    depends_on:
      - phoenix
      - neo4j
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-dev",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  neo4j_data:
  postgres_data:
